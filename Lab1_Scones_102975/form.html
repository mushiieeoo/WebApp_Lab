    <h1>A registration form</h1>
    <form method="post" action="" enctype="multipart/form-data">
        <fieldset>
            <legend>Personal Information</legend>
            <div>
                <label for ="fname">First Name</label>
                <input type="text" name="fname" id="fname" autofocus required>
            </div>
            <div>
                <label for="lname">Last Name</label>
                <input type="text" name="lname" id="lname" required>
            </div>
            <div>
                <label for="m">Gender</label>
                <input type="radio" name="gender" id="m">Male
                <input type="radio" name="gender" id="f">Female
            </div>
            <div>
                <label for="birthday">Birthday</label>
                <input type="date" id="birthday" name="birthday" min="1900-01-01" max="2026-10-20" required>
            </div>
            <div>
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min=1 required>
            </div>
            <div>
                <label for="telephone">Telephone</label>
                <input type="text" id="telephone" name="telephone" placeholder="60-10-2345689" required>
            </div>
            <div>
                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" required>
            </div>
        </fieldset>
